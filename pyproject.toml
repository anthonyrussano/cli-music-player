[project]
name = "music"
version = "2.2.0"
description = "Play and download YouTube albums and playlists from the terminal (mpv + yt-dlp)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
music = "music:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["music"]
